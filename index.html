<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse on Rails</title>
  </head>
  <body>
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <section id="hud" aria-live="polite">
      <div class="hud-top">
        <span id="hud-line" class="hud-line"></span>
        <span id="hud-caption" class="hud-caption"></span>
      </div>
      <div id="hud-sign" class="hud-sign"></div>
      <div id="hud-sub" class="hud-sub"></div>
      <div id="hud-hint" class="hud-hint"></div>
    </section>
    <div id="emergency" data-interactive hidden role="alertdialog" aria-labelledby="emergency-title">
      <div class="hazard"></div>
      <div class="emergency-box">
        <div id="emergency-title" class="emergency-title">⚠ 緊急停車 ⚠</div>
        <div class="emergency-lead">緊急停車します。</div>
        <div id="emergency-message" class="emergency-message"></div>
        <div class="emergency-actions">
          <button id="emergency-stop" class="emergency-stop">覚悟はできている（停車する）</button>
          <button id="emergency-cancel" class="emergency-cancel">やめておく</button>
        </div>
      </div>
      <div class="hazard"></div>
    </div>
    <div id="danger" hidden role="alert">
      <div class="danger-box">
        <div class="danger-title">⚠ 危険 ⚠</div>
        <div class="danger-lead">走行中の列車からは降りられません</div>
        <div class="danger-message">危ないので駅以外では下車しないでください！</div>
      </div>
    </div>
    <div id="celebration" data-interactive hidden role="alert"></div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
